services:
  postgres:
    image: postgres:17-alpine
    container_name: archicore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: archicore
      POSTGRES_USER: archicore
      POSTGRES_PASSWORD: archicore_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - archicore-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archicore -d archicore"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  archicore-postgres-data:

# Local document bytes are stored by the filesystem provider by default. Do not run the
# archived MinIO community server as a production dependency. A compatible endpoint can
# be selected through ObjectStorage__Provider=Minio for evaluation/development.
