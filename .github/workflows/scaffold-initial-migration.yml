name: One-time EF Core migration scaffold

on:
  push:
    branches:
      - feat/backend-core-api

permissions:
  contents: write

jobs:
  scaffold:
    if: contains(github.event.head_commit.message, '[scaffold-migration]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore packages and tools
        run: |
          dotnet tool restore
          dotnet restore src/ArchiCore.slnx

      - name: Build the EF Core model
        run: dotnet build src/ArchiCore.slnx --configuration Release --no-restore

      - name: Scaffold the initial migration
        run: dotnet ef migrations add InitialCoreSchema --project src/Backend/ArchiCore.Infrastructure/ArchiCore.Infrastructure.csproj --startup-project src/Backend/ArchiCore.API/ArchiCore.API.csproj --output-dir Persistence/Migrations

      - name: Commit generated migration and snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Backend/ArchiCore.Infrastructure/Persistence/Migrations
          git commit -m "db: scaffold initial PostgreSQL migration"
          git push origin "HEAD:${GITHUB_REF_NAME}"
