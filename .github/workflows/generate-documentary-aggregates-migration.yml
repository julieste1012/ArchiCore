name: Generate documentary aggregates migration

on:
  push:
    branches: [feat/documentary-domain-foundation]
    paths:
      - ".github/workflows/generate-documentary-aggregates-migration.yml"
      - "src/Backend/**"
      - "src/Tests/**"
      - "src/ArchiCore.slnx"
      - ".config/dotnet-tools.json"

permissions:
  contents: write

jobs:
  migration-and-validation:
    name: Generate migration, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore tools and solution
        run: |
          dotnet tool restore
          dotnet restore src/ArchiCore.slnx

      - name: Generate the versioned migration
        run: >
          dotnet tool run dotnet-ef migrations add AddDocumentaryAggregates
          --project src/Backend/ArchiCore.Infrastructure/ArchiCore.Infrastructure.csproj
          --startup-project src/Backend/ArchiCore.API/ArchiCore.API.csproj
          --context ArchiCoreDbContext
          --output-dir Persistence/Migrations

      - name: Build and test backend
        run: |
          dotnet build src/ArchiCore.slnx --configuration Release --no-restore
          dotnet test src/ArchiCore.slnx --configuration Release --no-build --no-restore

      - name: Commit migration and snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Backend/ArchiCore.Infrastructure/Persistence/Migrations
          if git diff --cached --quiet; then
            echo "No migration changes were generated."
            exit 0
          fi
          git commit -m "chore(db): add documentary aggregate persistence migration"
          git push origin "HEAD:${GITHUB_REF_NAME}"
