name: Container smoke

on:
  pull_request:
    paths:
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.env.example'
      - 'src/Backend/**'
      - 'src/Frontend/archicore-web/**'
      - '.github/workflows/container-smoke.yml'
  push:
    branches: [main, develop]
    paths:
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.env.example'
      - 'src/Backend/**'
      - 'src/Frontend/archicore-web/**'
      - '.github/workflows/container-smoke.yml'

permissions:
  contents: read

jobs:
  full-stack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Build and start the full local stack
        run: docker compose --profile app up -d --build

      - name: Wait for readiness and verify the frontend/API/authentication
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:7197/health/ready >/dev/null \
              && curl -fsS http://127.0.0.1:5173/ >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != "true" ]; then
            docker compose --profile app ps
            docker compose --profile app logs --no-color
            exit 1
          fi

          curl -fsS http://127.0.0.1:7197/health/ready
          curl -fsS http://127.0.0.1:5173/ | grep -qi 'ArchiCore'

          response=$(curl -fsS -X POST http://127.0.0.1:5173/api/auth/login \
            -H 'Content-Type: application/json' \
            --data '{"email":"admin@archicore.local","password":"ArchiCore_LocalAdmin_2026!"}')
          printf '%s' "$response" | jq -e '.accessToken and .refreshToken and .user.role == "SystemAdministrator"'

      - name: Print service logs on failure
        if: failure()
        run: docker compose --profile app logs --no-color

      - name: Stop the local stack
        if: always()
        run: docker compose --profile app down
